name: Deploy NYT Headliner

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-nyt-headliner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over Tailscale SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "root@${VPS_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          APP_DIR=/home/deploy/apps/nyt-headliner
          export PATH="/usr/bin:$PATH"

          if [[ ! -d "$APP_DIR/.git" ]]; then
            echo "App dir is not a git checkout; aborting"
            exit 1
          fi

          if [[ -f "$APP_DIR/.env.local" ]]; then
            cp -a "$APP_DIR/.env.local" /tmp/nyt-headliner.env.local.bak
          fi

          chown -R deploy:deploy "$APP_DIR"
          sudo -u deploy bash -lc "
            set -euo pipefail
            cd '$APP_DIR'
            git remote get-url origin >/dev/null
            git fetch origin master
            git reset --hard origin/master
          "

          if [[ -f /tmp/nyt-headliner.env.local.bak ]]; then
            cp -a /tmp/nyt-headliner.env.local.bak "$APP_DIR/.env.local"
            chown deploy:deploy "$APP_DIR/.env.local"
            chmod 600 "$APP_DIR/.env.local"
          fi

          sudo -u deploy bash -lc "
            set -euo pipefail
            cd '$APP_DIR'
            npm install --legacy-peer-deps
            npm run build
            cd /home/deploy
            pm2 restart nyt-headliner --update-env
            pm2 save
          "
          echo "NYT Headliner deploy OK"
          EOF
